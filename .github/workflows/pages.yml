# Deploy the Vite demo (`dist-app/`) to GitHub Pages.
#
# One-time repo setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
# After the first successful run, open the site URL shown on the Pages settings page.

name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      # `build:demo` runs `build:lib` then bundles the demo against `dist/pixel-pusher.bundle.js`.
      - run: npm run build:demo

      - name: Assert demo JS is not tree-shaken (expect Lit + component in bundle)
        run: |
          set -e
          main=$(ls dist-app/assets/index-*.js | head -1)
          size=$(wc -c < "$main")
          echo "Demo bundle: $main ($size bytes)"
          test "$size" -gt 15000

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
